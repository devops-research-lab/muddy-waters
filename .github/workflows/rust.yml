name: rust
on:
  push: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: Run cargo fmt
      run: cargo fmt --all -- --check
  clippy:
    name: Clippy
    needs:
    - fmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo -V && rustc -V
    - name: Run clippy
      run: cargo clippy --all --tests --all-features --all-targets -- -D warnings
  rustdoc:
    name: Rustdoc
    needs:
    - fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: muddy
      run: 'cargo rustdoc -p muddy --all-features -- -D warnings

        '
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - name: run tests
      run: cargo test
